name: Backend CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Hardcoded Secrets Static Analysis Gate
        run: |
          echo "Scanning for hardcoded secret assignments in src/main/java..."
          if grep -rn -E 'private String .*(Secret|SignSecret) *= *"[^"]+"' src/main/java; then
            echo "::error::Detected hardcoded secret assignment in Java source files!"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Run Spotless Code Format Check
        run: ./mvnw -B spotless:check

      - name: Run Unit Tests with JaCoCo Coverage
        run: ./mvnw -B test -Djava.awt.headless=true

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: target/site/jacoco
          retention-days: 7
          if-no-files-found: ignore
