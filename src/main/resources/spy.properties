# ===================================================================
# P6Spy 数据库访问层监控配置 (P3-3 慢 SQL 监控与真实耗时诊断)
# 拦截 JDBC 底层驱动，输出真实带参 SQL、执行耗时与连接编号，不影响生产性能
# ===================================================================

# 1. 采用 SLF4J 统一日志门面输出
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 2. 单行日志格式：%当前时间|耗时(ms)|分类|连接ID|真实单行SQL
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=[P6Spy-SQL] %(executionTime)ms | cat=%(category) | conn=%(connectionId) | %(sqlSingleLine)

# 3. 过滤干扰项：排除 resultset 遍历与 debug 游标操作，聚焦 statement/batch
excludecategories=info,debug,result,resultset

# 4. 慢 SQL 判定阈值 (毫秒)，超过阈值的会被单独关注
executionThreshold=100

# 5. 时间格式化
dateformat=yyyy-MM-dd HH:mm:ss
