spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword # 请根据本地实际数据库密码修改
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1.0.0
  data:
    redis:
      host: localhost
      port: 6379
      password: redispassword
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

# MyBatis-Plus 配置 (纯注解开发，开启 Slf4jImpl SQL 日志用于开发诊断)
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# P6Spy 数据源装饰器开关 (开发环境默认开启，生产可通过环境变量开关)
decorator:
  datasource:
    p6spy:
      enable-logging: true

logging:
  level:
    com.campus: debug
    com.campus.modules.activity.mapper: debug
    com.campus.modules.mall.mapper: debug
    com.campus.modules.student.mapper: debug
    p6spy: info
    org.springframework.web: info

