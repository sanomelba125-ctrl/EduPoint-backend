spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword # 请根据本地实际数据库密码修改
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1.0.0
  sql:
    init:
      # 演示种子数据按需导入支持 (生产环境严格关闭；开发测试需要时可设为 always)
      mode: never
      data-locations: classpath:data/demo-data.sql
  data:
    redis:
      host: localhost
      port: 6379
      password: redispassword
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

# MyBatis-Plus 配置 (纯注解开发，开启 Slf4jImpl SQL 日志用于开发诊断)
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# P6Spy 数据源装饰器开关 (开发环境默认开启，生产可通过环境变量开关)
decorator:
  datasource:
    p6spy:
      enable-logging: true

logging:
  level:
    com.campus: debug
    com.campus.modules.activity.mapper: debug
    com.campus.modules.mall.mapper: debug
    com.campus.modules.student.mapper: debug
    p6spy: info
    org.springframework.web: info

# 对象存储模式配置 (local: 本地磁盘存储，开发默认; qiniu: 七牛云 Kodo 存储)
campus:
  oss:
    type: ${CAMPUS_OSS_TYPE:local}

# 七牛云 Kodo 对象存储配置
# [说明] 优先从 application-local.yml 读取（开发私有不入库），亦可配置环境变量 QINIU_ACCESS_KEY 等
#
# ⚠️ 重要提示（2026-10）：项目曾使用的七牛「测试域名」(*.clouddn.com) **已被七牛官方回收**，
#    DNS 现指向 testdomain-offline.qiniu.in，历史图片全部 404 且无法恢复。
#    七牛测试域名有效期仅 30 天，到期即回收，这是历史图片失效的根因。
#    若要启用 qiniu 模式，必须先在七牛控制台绑定自有【已备案】域名并把 domain-url 指向它；
#    否则请保持 campus.oss.type=local（默认值，图片落盘到 backend/uploads/images）。
#
# 如需在开发环境中直接配置，可取消注释并填入：
# qiniu:
#   access-key: ${QINIU_ACCESS_KEY:}
#   secret-key: ${QINIU_SECRET_KEY:}
#   bucket: ${QINIU_BUCKET:}
#   domain-url: ${QINIU_DOMAIN_URL:}




