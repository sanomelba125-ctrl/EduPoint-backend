spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword # 请根据本地实际数据库密码修改
    hikari:
      initialization-fail-timeout: -1
  data:
    redis:
      host: localhost
      port: 6379
      password: redispassword
      timeout: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.campus: debug
    org.springframework.web: info

# 七牛云 Kodo 对象存储配置
# [安全提示] 真实 AK/SK 已保存在 application-local.yml 中，此处仅保留安全占位符以防 Git 泄露
qiniu:
  access-key: ${QINIU_ACCESS_KEY:your-access-key}
  secret-key: ${QINIU_SECRET_KEY:your-secret-key}
  bucket: ${QINIU_BUCKET:your-bucket-name}
  domain-url: ${QINIU_DOMAIN_URL:http://your-domain/}



