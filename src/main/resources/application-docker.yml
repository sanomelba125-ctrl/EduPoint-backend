spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/campus_activity?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootpassword
    hikari:
      initialization-fail-timeout: 30000
      # 与秒杀线程池核心线程数(32)对齐，详见 application-dev.yml 同项注释
      minimum-idle: 16
      maximum-pool-size: 48
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1.0.0
  data:
    redis:
      host: redis
      port: 6379
      password: redispassword
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 与 application.yml 保持一致：默认自动确认，需要手动的监听器在注解上显式声明 ackMode="MANUAL"
        acknowledge-mode: auto
        prefetch: 10
        # 消费者并发度，与 application-dev.yml 保持一致
        concurrency: 4
        max-concurrency: 8

# MyBatis-Plus 配置 (纯注解开发，已清理空转的 XML 扫描与实体别名配置)
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# P6Spy 数据源装饰器开关 (Docker 生产环境默认关闭，保障零性能损耗)
decorator:
  datasource:
    p6spy:
      enable-logging: ${ENABLE_P6SPY:false}

logging:
  level:
    com.campus: info
    org.springframework.web: info

# 七牛云 Kodo 对象存储配置
qiniu:
  access-key: your-access-key
  secret-key: your-secret-key
  bucket: your-bucket-name
  domain-url: http://your-domain/

