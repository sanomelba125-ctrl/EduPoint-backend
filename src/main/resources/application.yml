server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-activity-platform
  profiles:
    active: dev,local
  config:
    import:
      - optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true


# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400 # 绝对最大有效期: 24小时 (86400秒)
  active-timeout: 1800 # 临时动态活跃寿命: 30分钟 (1800秒，期间有操作则自动续签刷新；连续30分钟无任何操作则自动失效)
  auto-renew: true # 开启自动续签，持续操作自动顺延
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

activity:
  qrcode:
    valid-seconds: ${ACTIVITY_QR_VALID_SECONDS:300}
    sign-secret: ${ACTIVITY_QR_SIGN_SECRET:EduPoint@QrSign#2026}
    checkin-base-url: ${ACTIVITY_CHECKIN_BASE_URL:http://localhost:5173/#/checkin}

# WebSocket 握手鉴权配置
websocket:
  auth:
    # Origin 白名单(逗号分隔)，单个 * 表示放行所有来源(仅建议本地开发使用)
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3200,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3200,http://127.0.0.1:5173}
    # 是否放行不带 Origin 请求头的非浏览器客户端(微信小程序原生连接、部分真机调试不会携带 Origin)
    allow-missing-origin: ${WEBSOCKET_ALLOW_MISSING_ORIGIN:true}

# AI 客服大模型配置 (商汤日日新 SenseNova 6.8 Flash Lite)
ai:
  llm:
    provider: ${AI_LLM_PROVIDER:sensenova} # 提供商: sensenova / openai / deepseek / local
    enabled: ${AI_LLM_ENABLED:true} # 启用大语言模型调用 (未配 Key 或网络异常时自动无缝降级为本地智能工具引擎)
    base-url: ${AI_LLM_BASE_URL:https://api.sensenova.cn/compatible-mode/v1}
    api-key: ${SENSENOVA_API_KEY:${AI_LLM_API_KEY:}} # 商汤开放平台 API 密钥 (必须通过环境变量配置，禁止硬编码)
    model: ${AI_LLM_MODEL:SenseNova-6.8-Flash-Lite}
    temperature: ${AI_LLM_TEMPERATURE:0.2}
    timeout-seconds: 60
    reasoning-effort: ${AI_LLM_REASONING_EFFORT:none} # 客服模式设为 none 关闭思考以秒级响应；可选 low/medium/high
    max-tokens: 4096

# 平台业务规约配置
campus:
  mall:
    order-timeout-ms: ${CAMPUS_MALL_ORDER_TIMEOUT_MS:86400000} # 礼品订单未提货自动关单时效 (默认 24 小时 / 86400000 毫秒)
