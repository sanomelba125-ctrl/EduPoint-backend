server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-activity-platform
  profiles:
    active: dev,local
  config:
    import:
      - optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB


# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000 # 30天
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
