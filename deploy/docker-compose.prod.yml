# ===================================================================
# 【仓库内副本】由项目根目录 docker-compose.prod.yml 同步而来
# 用途：让生产编排随 backend 仓库一起版本化、可追溯、可推送云端
#
# 路径差异（本文件位于 backend/deploy，build context 已相应重写）：
#   根目录 ./backend    -> ..
#   根目录 ./admin-web  -> ../../admin-web
#   根目录 ./mobile-app -> ../../mobile-app
#
# 运行方式（在项目根目录执行，显式指定 env 文件）：
#   docker compose -f backend/deploy/docker-compose.prod.yml --env-file .env.prod up -d
#
# 修改部署逻辑后请同步根目录原文件，避免两份漂移。
# ===================================================================

# ===================================================================
# 校园活动积分平台 (EduPoint) - 生产级多容器服务编排模板 (docker-compose.prod.yml)
# 
# 【企业级生产加固特性】:
# 1. 资源限制：各服务配置 CPU/内存限制 (deploy.resources.limits)，防止突发流量 OOM 压垮宿主机；
# 2. 日志轮转：限制单容器日志上限 50MB (max-file: 3)，杜绝生产磁盘被打爆；
# 3. 严格健康检查：服务依赖全部基于 condition: service_healthy，确保拓扑强保活；
# 4. 数据库治理：移除非必要的 init.sql 侵入挂载，表结构生命周期完全由 Flyway 纳管；
# 5. 网络边界隔离：划分内部数据总线 (backend-tier) 与对外应用网络 (public-tier)。
# ===================================================================

version: "3.8"

services:
  # -------------------------------------------------------------------
  # 1. MySQL 8.0 生产关系型数据库
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: campus-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env.prod}
      MYSQL_DATABASE: campus_activity
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - internal-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env.prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------
  # 2. Redis 7.0 内存集群与缓存中台
  # -------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: campus-redis-prod
    restart: always
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod} 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy volatile-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - internal-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # -------------------------------------------------------------------
  # 3. RabbitMQ 3.13 生产削峰与延时消息队列
  # -------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: campus-rabbitmq-prod
    restart: always
    ports:
      - "15672:15672" # 仅暴露 Web 运维控制台端口，AMQP 5672 保持内部隔离
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campus_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set in .env.prod}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - internal-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 4. 后端核心服务 (Spring Boot 3.3.2 瘦身生产镜像，~150MB)
  # -------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: campus-activity-backend:prod
    container_name: campus-backend-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_activity?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env.prod}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-campus_admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set in .env.prod}
      ACTIVITY_QR_SIGN_SECRET: ${ACTIVITY_QR_SIGN_SECRET:?ACTIVITY_QR_SIGN_SECRET must be set in .env.prod}
      MALL_PICKUP_SIGN_SECRET: ${MALL_PICKUP_SIGN_SECRET:?MALL_PICKUP_SIGN_SECRET must be set in .env.prod}
      CAMPUS_TRUST_FORWARDED_HEADERS: "true"
      SENSENOVA_API_KEY: ${SENSENOVA_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal-network
      - public-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------------------
  # 5. 管理端后台前端 (Vue 3 + Nginx Alpine 静态伺服，~25MB)
  # -------------------------------------------------------------------
  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
    image: campus-activity-admin-web:prod
    container_name: campus-admin-web-prod
    restart: always
    ports:
      - "80:80" # 对外标准 Web 入口
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # -------------------------------------------------------------------
  # 6. 学生移动端前端 (Uni-app H5 + Nginx Alpine 静态伺服，~25MB)
  # -------------------------------------------------------------------
  mobile-app:
    build:
      context: ../../mobile-app
      dockerfile: Dockerfile
    image: campus-activity-mobile-app:prod
    container_name: campus-mobile-app-prod
    restart: always
    ports:
      - "5173:80" # 移动端独立端口
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

networks:
  # 内部高保密数据网络（数据存储不对外暴露端口）
  internal-network:
    driver: bridge
    internal: true
  # 对外应用与网关网络
  public-network:
    driver: bridge

volumes:
  mysql_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:
  uploads_data:
